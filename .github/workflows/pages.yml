name: Validate and publish isolated preview
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Preserve existing public preview homepage contract
        run: python validate.py
      - name: Test source-authorized console release boundary
        run: python scripts/test_public_console.py
      - name: Checkout pinned public mathematics source read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: grandchallenge/MATH-PROGRAMME
          ref: a55255f01b18139ddf045d4c82fb566c3e77f36d
          path: math-source
          persist-credentials: false
      - name: Install exact renderer dependencies
        run: python -m pip install --requirement math-source/requirements/docs.txt --requirement math-source/requirements/zensical-probe.txt
      - name: Build independent MkDocs source baseline
        working-directory: math-source
        run: mkdocs build --clean --site-dir .mkdocs-probe-site
      - name: Prepare source-locked compendia for Zensical
        working-directory: math-source
        run: python ci/zensical_parity_probe.py prepare
      - name: Build canonical Zensical candidate
        working-directory: math-source
        run: zensical build --config-file zensical-probe.yml --clean
      - name: Fail closed on canonical renderer parity
        working-directory: math-source
        run: python ci/zensical_parity_probe.py verify
      - name: Build isolated staging URL and preserve original preview homepage
        run: python stage_zensical.py --source math-source --source-sha a55255f01b18139ddf045d4c82fb566c3e77f36d
      - name: Validate staging search contrast in real Chromium
        run: |
          python -m pip install --requirement math-source/requirements/browser-b01.txt
          python -m playwright install --with-deps chromium
          python check_search_contrast.py
      - name: Upload public Pages payload (only on main)
        if: github.event_name != 'pull_request'
        uses: grandchallenge/upload-pages-artifact@4934497e00858680775a65f544192e61e1b1b3cb
        with:
          path: .pages-output
      - name: Preserve exact-source staging proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zensical-preview-source-receipt
          path: |
            .pages-output/zensical-staging-receipt.json
            math-source/zensical-parity-report.json
          if-no-files-found: ignore
          retention-days: 30
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deploy
